name: Build check

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'eslint.config.mjs'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'eslint.config.mjs'

jobs:
  check-web:
    name: Web — typecheck + build + i18n
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript check
        run: pnpm --filter wavvon-web exec tsc --noEmit

      - name: vitest
        run: pnpm --filter wavvon-web test

      - name: Web vite build
        run: pnpm --filter wavvon-web build

      - name: Hub-target vite build
        run: pnpm --filter wavvon-web build:hub

      - name: The two builds do not ship each other's screens
        run: pnpm --filter wavvon-web run check-hub-build

      - name: i18n coverage check
        run: pnpm --filter wavvon-web run check-i18n

      - name: No new hardcoded UI strings
        run: pnpm --filter wavvon-web run check-hardcoded

      - name: No unread translation keys
        run: pnpm --filter @wavvon/i18n run check-unused-keys

      - name: No unused CSS classes
        run: pnpm --filter @wavvon/ui run check-unused-css

      - name: No untranslated strings
        run: pnpm --filter wavvon-web run check-untranslated

      - name: Shared feature props reach both clients
        run: pnpm run check-parity
