name: Build check

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

jobs:
  check-web:
    name: Web — typecheck + build + i18n
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter wavvon-web exec tsc --noEmit

      - name: vitest
        run: pnpm --filter wavvon-web test

      - name: Web vite build
        run: pnpm --filter wavvon-web build

      - name: Hub-target vite build
        run: pnpm --filter wavvon-web build:hub

      - name: The two builds do not ship each other's screens
        run: pnpm --filter wavvon-web run check-hub-build

      - name: i18n coverage check
        run: pnpm --filter wavvon-web run check-i18n

      - name: No new hardcoded UI strings
        run: pnpm --filter wavvon-web run check-hardcoded

      - name: Shared feature props reach both clients
        run: pnpm run check-parity
