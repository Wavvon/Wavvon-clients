[package]
name = "wavvon-voice"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Audio capture/playback (WASAPI on Windows, CoreAudio on macOS, ALSA on Linux)
cpal = "0.15"

# Opus voice codec (bundles libopus — no system install needed)
audiopus = "0.2"

# Lock-free ring buffer (bridges real-time audio thread ↔ async tokio thread)
ringbuf = "0.4"

# Packet serialization
byteorder = "1"

# Noise suppression (RNNoise neural network, pure Rust)
nnnoiseless = "0.5"

# Voice-transport v2 (docs/docs/voice-transport-v2.md): WebTransport/QUIC
# client replacing raw UDP; same version the hub relay is built against.
wtransport = "0.7.1"

# Per-packet AEAD for sealed voice datagrams (already the project cipher).
aes-gcm = "0.10"

# Hex for the cert-hash pin passed to wtransport's server-certificate-hashes trust.
hex = "0.4"

[dev-dependencies]
# Reads the vendored wire-format vectors (wire-vectors/ at the repo root).
serde_json = { workspace = true }
