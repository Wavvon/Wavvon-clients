[package]
name = "wavvon-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "wavvon_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tracing = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
anyhow = { workspace = true }
# rustls, not the default native-tls: that pulled OpenSSL on Linux and was the
# last thing in this repo that did. **native-roots**, not webpki, on purpose —
# native-tls read the OS trust store, and a self-hosted hub whose certificate
# comes from a CA only present there (a corporate internal CA) has to keep
# working. `default-features = false` turns off the whole default set, so
# everything in it except `default-tls` is named back: charset, http2,
# system-proxy.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bip39 = "2"
curve25519-dalek = "4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
wavvon-voice = { path = "../../../crates/voice" }
# Same swap as reqwest above, same reason for native-roots over webpki.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
dirs = "6"
url = "2"
mime_guess = "2"
xcap = "0.3.3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
